<rect x="20" y="20" width="960" height="520" rx="28" fill="#F6F9F7" stroke="#B9CBC3" stroke-width="3"/>
<rect x="20" y="20" width="960" height="520" rx="28" fill="url(#c1)"/><rect x="20" y="20" width="960" height="520" rx="28" fill="url(#c2)"/>
